<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>아산시장배 마스터즈 수영대회</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@1,900&family=Barlow+Condensed:wght@700;800&family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* NINE 팀 카드 톤: 검은 바탕 + 가는 가로줄, 핑크 점선 레인 로프, 외곽선 9 워터마크, 핑크 띠 */
:root{
  --bg:#0c0c0d; --panel:#141415; --panel2:#1b1b1d; --ink:#f4f3f1; --sub:#a9a6a2; --dim:#6d6a67; --rule:#2a2a2c;
  --pink:#d9467f; --pink-txt:#e98bb0; --pink-line:rgba(217,70,127,.45); --pink-ink:#111111; --paper:#f4f3f1; --paper-ink:#111111;
  --cond:"Barlow Condensed","Noto Sans KR",system-ui,sans-serif;
  --mono:"DM Mono","IBM Plex Mono",ui-monospace,monospace;
  --kr:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --tabh:64px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--kr);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 4px)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.rope{height:3px;background:radial-gradient(circle,var(--pink) 1.2px,transparent 1.6px) 0 50%/7px 3px repeat-x;opacity:.5}

/* 머리: 팀 카드 앞면 */
.hero{position:relative;overflow:hidden;padding-block:22px 0}
.hero::after{content:"9";position:absolute;right:-18px;top:-30px;font-family:var(--cond);font-weight:800;font-size:15rem;line-height:1;color:transparent;-webkit-text-stroke:2px #2c2c2e;pointer-events:none}
.hero .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative;z-index:1}
.logo{display:inline-block;position:relative;font-family:"Barlow",var(--cond);font-style:italic;font-weight:900;font-size:2.6rem;line-height:.9;color:var(--pink);letter-spacing:-.04em;padding-bottom:10px}
.logo::after{content:"";position:absolute;left:2px;bottom:0;width:115%;height:5px;background:var(--pink);border-radius:4px 0 0 4px;clip-path:polygon(0 30%,100% 0,100% 40%,0 100%)}
.stamp{font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;color:var(--sub);text-align:right;line-height:1.7;text-transform:uppercase}
.hero h1{position:relative;z-index:1;font-weight:900;font-size:1.55rem;line-height:1.2;letter-spacing:-.02em;margin:22px 0 4px;text-wrap:balance}
.hero .where{position:relative;z-index:1;font-family:var(--mono);font-size:.76rem;color:var(--sub);letter-spacing:.04em;padding-bottom:16px}
.band{background:var(--pink);color:var(--pink-ink)}
.band .wrap{display:flex;justify-content:space-between;align-items:center;padding-block:9px;font-family:var(--cond);font-weight:800;font-size:1.15rem;letter-spacing:.14em;text-transform:uppercase}
.heart{display:inline-block;width:.85em;height:.78em;vertical-align:-.05em;margin:0 .18em}
.heart path{fill:var(--paper)}

main{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 28px)}
section{padding-top:18px}
.label{font-family:var(--kr);font-size:.78rem;letter-spacing:.02em;color:var(--sub);text-transform:uppercase;margin:0 0 10px}
h2{font-family:var(--cond);font-weight:800;font-size:1.5rem;letter-spacing:.06em;text-transform:uppercase;margin:0 0 12px}
.helplist{margin:16px 2px 14px;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;color:var(--sub);font-size:.86rem}
.helplist li::before{content:"·";color:var(--pink-txt);font-weight:900;margin-right:8px}
.flex-note{margin:0 0 14px;padding:10px 12px;border:1px solid #2e2e31;border-left:3px solid var(--pink);border-radius:8px;background:var(--panel);font-size:.86rem;color:var(--ink)}
.note{color:var(--sub);font-size:.8rem;margin:12px 2px 0}

/* 아래 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0a0a0a;border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:500;color:var(--dim);cursor:pointer;position:relative}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;background:var(--pink)}

/* 검색 */
.searchbox{position:relative}
.searchbox input{width:100%;font:500 1.05rem var(--kr);padding:15px 46px 15px 16px;border-radius:14px;border:1.5px solid #3a3a3d;background:var(--panel);color:var(--ink);-webkit-appearance:none;appearance:none}
.searchbox input::placeholder{color:var(--dim)}
.searchbox input:focus{outline:none;border-color:var(--pink)}
.clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:#2c2c2e;cursor:pointer;font-size:1rem;line-height:1;color:var(--ink)}
.hint{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hint button{border:1px solid #333336;background:var(--panel);border-radius:999px;padding:6px 12px;font-size:.84rem;cursor:pointer;color:var(--ink)}
.hint button.nine{border-color:var(--pink-line);color:var(--pink-txt);font-weight:600}
.count{font-family:var(--mono);font-size:.76rem;letter-spacing:.06em;color:var(--sub);margin:18px 2px 10px}
.helptext{color:var(--sub);font-size:.88rem;margin:16px 2px 8px}
.people{display:flex;flex-direction:column;gap:12px}

/* 선수 카드 = 팀 카드 축소판 */
.person{position:relative;background:var(--panel);border-radius:16px;overflow:hidden;border:1px solid #232325}
.person .top{position:relative;padding:14px 16px 12px}
.person.nine .top::after{content:"9";position:absolute;right:-6px;top:-22px;font-family:var(--cond);font-weight:800;font-size:7rem;line-height:1;color:transparent;-webkit-text-stroke:1.5px #2c2c2e;pointer-events:none}
.person .pn{position:relative;font-size:1.6rem;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.person .pt{position:relative;font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;color:var(--sub);text-transform:uppercase;margin-top:2px}
.person.nine .pt{color:var(--pink-txt)}
.person .list{background:var(--panel2)}
.entry{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;padding:10px 16px;border-top:1px dotted #333}
.entry .ev{min-width:0}
.entry .ev b{display:block;font-weight:700;font-size:.95rem}
.entry .ev span{display:block;font-family:var(--mono);font-size:.72rem;color:var(--sub);letter-spacing:.03em}
.person .foot{display:flex;justify-content:space-between;align-items:center;padding:7px 16px;background:var(--paper);color:var(--paper-ink);font-family:var(--cond);font-weight:800;letter-spacing:.14em;font-size:.95rem;text-transform:uppercase}
.person.nine .foot{background:var(--pink);color:var(--pink-ink)}
.person .foot .heart path{fill:var(--pink)}
.person.nine .foot .heart path{fill:var(--paper)}
mark{background:none;color:var(--pink-txt);text-decoration:underline;text-underline-offset:3px}

/* 레인 번호판 */
.plate{width:48px;height:48px;border-radius:9px;background:var(--paper);color:var(--paper-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.plate small{font-family:var(--mono);font-size:.52rem;letter-spacing:.12em;opacity:.7}
.plate b{font-family:var(--cond);font-weight:800;font-size:1.7rem;font-variant-numeric:tabular-nums}
.plate.pk{background:var(--pink);color:var(--pink-ink)}
.plate.sm{width:34px;height:34px;border-radius:7px}
.plate.sm b{font-size:1.25rem}
.plate.sm small{display:none}

/* 시간표 */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:63px;top:12px;bottom:12px;width:2px;background:radial-gradient(circle,var(--pink) 1px,transparent 1.4px) 50% 0/2px 6px repeat-y;opacity:.4}
.tl{display:grid;grid-template-columns:54px 20px 1fr;gap:0 8px;align-items:start;padding:7px 0}
.tl .clock{font-family:var(--cond);font-weight:700;font-variant-numeric:tabular-nums;font-size:1.15rem;letter-spacing:.03em;text-align:right;padding-top:8px}
.tl .dot{width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--sub);margin:14px 0 0 4px;position:relative;z-index:1}
.tl.rest .dot{border-color:#3a3a3d}
.tl.rest .clock{color:var(--dim)}
.tl.now .dot{background:var(--pink);box-shadow:0 0 0 4px rgba(255,42,138,.25)}
.tl .box{background:var(--panel);border:1px solid #232325;border-radius:12px;padding:10px 12px;text-align:left;width:100%;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.tl.rest .box{background:none;border:0;padding:9px 0 0;cursor:default;color:var(--dim);font-size:.86rem}
.tl .box .nm{font-weight:700;display:block}
.tl .box .meta{font-family:var(--mono);font-size:.72rem;color:var(--sub);display:block}
.tl .box .arrow{color:var(--pink-txt);flex:none;font-size:.8rem;font-weight:700}
.tl.now .box{border-color:var(--pink)}
.badge{display:inline-block;font-family:var(--cond);font-size:.78rem;font-weight:800;letter-spacing:.1em;background:var(--pink);color:var(--pink-ink);padding:0 6px;border-radius:3px;margin-left:6px;vertical-align:2px}

/* 조편성 */
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid #333336;background:var(--panel);border-radius:999px;padding:7px 13px;font-size:.85rem;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.heats{display:flex;flex-direction:column;gap:12px}
.heat{background:var(--panel);border:1px solid #232325;border-radius:14px;overflow:hidden}
.heat h3{margin:0;padding:10px 14px;display:flex;gap:10px;align-items:baseline;font-size:.92rem;font-weight:700;border-bottom:1px dotted #3a3a3d}
.heat h3 .no{font-family:var(--cond);font-weight:800;font-size:1.25rem;color:var(--pink-txt);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.heat ol{list-style:none;margin:0;padding:5px 0}
.heat li{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:4px 14px}
.heat li .who{font-weight:500;min-width:0}
.heat li .club{font-family:var(--mono);font-size:.74rem;color:var(--sub);text-align:right;letter-spacing:.04em}
.heat li.nine .who,.heat li.nine .club{color:var(--pink-txt)}
.heat li.empty .plate{background:#232325;color:var(--dim)}
.heat li.empty .who{color:var(--dim);font-weight:400}

/* PDF */
.pdfbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.pdfbar h2{margin:0}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--pink);color:var(--pink-ink);padding:9px 14px;border-radius:10px;font-weight:700;font-size:.88rem;text-decoration:none;cursor:pointer}
.pagewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) ;padding:0 max(8px,env(safe-area-inset-left,0px))}
.pages{display:flex;flex-direction:column;gap:10px;width:100%}
.pages canvas{display:block;background:#fff;border-radius:6px;max-width:none}
.loading{color:var(--sub);text-align:center;padding:30px 0}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

  if(!l.team)return;
  const key=h.relay?"팀|"+l.team:l.name+"|"+l.team;
  if(!(norm(l.name).includes(q)||norm(l.team).includes(q)))return;
  if(!map.has(key))map.set(key,{name:h.relay?l.team+" (팀)":l.name,team:h.relay?"단체전":l.team,relay:h.relay,list:[]});
  map.get(key).list.push({h,l});
 }));
 let ppl=[...map.values()].sort((a,b)=>(a.relay-b.relay)||(norm(a.name).includes(q)?0:1)-(norm(b.name).includes(q)?0:1)||a.name.localeCompare(b.name,"ko"));
 if(!ppl.length){$("#findres").innerHTML=`<p class="helptext">"${esc(raw)}" 검색 결과 없음</p>`;return}
 const n=ppl.filter(p=>!p.relay).length;
 $("#findres").innerHTML=`<p class="count">${n} SWIMMERS${ppl.length>n?` · ${ppl.length-n} RELAY`:""}</p><div class="people">`+ppl.map(p=>{const nine=isNine(p.relay?p.name:p.team);return `
  <article class="person${nine?" nine":""}"><div class="top"><div class="pn">${hl(p.name,q)}</div><div class="pt">${hl(p.team,q)}</div></div>
  <div class="list">${p.list.map(({h,l})=>`<div class="entry">${plate(l.lane,0,nine)}<div class="ev"><b>${esc(h.label)}</b><span>HEAT ${h.no} · ${h.ev?`${RACE.indexOf(h.ev)+1}경기 ${h.ev.s}–${h.ev.e}`:""}</span></div></div>`).join("")}</div>
  <div class="foot"><span>${p.list.length} ${p.list.length>1?"Races":"Race"}</span><span>${nine?`I${HEART}AM 9`:"Asan Masters"}</span></div>
  </article>`}).join("")+`</div>`;
}
$("#q").addEventListener("input",find);
$("#clr").onclick=()=>{$("#q").value="";find();$("#q").focus()};
$("#findres").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(b){$("#q").value=b.dataset.t;find()}});

/* 시간표 */
function renderSched(){const now=nowKey();
 $("#sched").innerHTML=EVENTS.map(e=>{
  const isNow=now===e;
  if(e.rest)return `<li class="tl rest"><span class="clock">${e.s}</span><span class="dot"></span><div class="box">${e.n}</div></li>`;
  if(e.award)return `<li class="tl${isNow?" now":""}"><span class="clock">${e.s}</span><span class="dot"></span><div class="box" style="cursor:default"><span><span class="nm">${e.n}${isNow?'<span class="badge">진행 중</span>':""}</span><span class="meta">${e.s} ~ ${e.e}</span></span></div></li>`;
  const cnt=HEATS.filter(e.match).length;
  return `<li class="tl${isNow?" now":""}"><span class="clock">${e.s}</span><span class="dot"></span><button class="box" data-k="${e.k}"><span><span class="nm">${RACE.indexOf(e)+1}경기 · ${e.n}${isNow?'<span class="badge">진행 중</span>':""}</span><span class="meta">${e.s} ~ ${e.e} · ${cnt}개 조${e.k==="medley"?" · 배→평→접→자":""}</span></span><span class="arrow">조 편성 ›</span></button></li>`;
 }).join("");
}
$("#sched").addEventListener("click",ev=>{const b=ev.target.closest("[data-k]");if(!b)return;st.ev=b.dataset.k;st.sex="all";renderHeats();show("heats")});

/* 조편성 */
function renderHeats(){
 $("#evchips").innerHTML=RACE.map((e,i)=>`<button aria-pressed="${st.ev===e.k}" data-k="${e.k}">${i+1}. ${e.n}</button>`).join("");
 const e=RACE.find(x=>x.k===st.ev)||RACE[0];const mixed=e.k==="relay"||e.k==="medley";
 $("#sexchips").hidden=mixed;
 $("#sexchips").innerHTML=[["all","남녀 전체"],["m","남자"],["w","여자"]].map(([k,t])=>`<button aria-pressed="${st.sex===k}" data-s="${k}">${t}</button>`).join("");
 let list=HEATS.filter(e.match);
 if(!mixed&&st.sex!=="all")list=list.filter(h=>h.title.startsWith(st.sex==="m"?"남자":"여자"));
 $("#heatlist").innerHTML=list.map(h=>`<article class="heat"><h3><span class="no">${h.no}</span><span>${esc(h.label)}</span></h3><ol>${
  h.lanes.map(l=>{const has=h.relay?l.team:l.name;const nn=isNine(l.team);return `<li class="${has?"":"empty"}${nn?" nine":""}">${plate(l.lane,1,nn)}<span class="who">${has?esc(h.relay?l.team:l.name):"빈 레인"}</span><span class="club">${h.relay?"":esc(l.team)}</span></li>`}).join("")}</ol></article>`).join("")
  +(mixed?`<p class="note">팀별 출전 선수 명단: 경기 시작 30분 전까지 제출</p>`:"");
 const a=$("#evchips [aria-pressed=true]");if(a)a.scrollIntoView({inline:"center",block:"nearest"});
}
$("#evchips").addEventListener("click",ev=>{const b=ev.target.closest("[data-k]");if(!b)return;st.ev=b.dataset.k;save();renderHeats()});
$("#sexchips").addEventListener("click",ev=>{const b=ev.target.closest("[data-s]");if(!b)return;st.sex=b.dataset.s;save();renderHeats()});

/* PDF */
let pdfDoc=null,pdfZoom=1,pdfJob=0,pdfStarted=false;
/* 페이지 바깥 흰 여백을 잘라내서 같은 폭에서도 글자가 크게 보이게 함 */
function trimBox(cv){const w=cv.width,h=cv.height,d=cv.getContext("2d").getImageData(0,0,w,h).data;
 let x0=w,y0=h,x1=0,y1=0;const st=2;
 for(let y=0;y<h;y+=st){const r=y*w*4;for(let x=0;x<w;x+=st){const i=r+x*4;if(d[i]<235||d[i+1]<235||d[i+2]<235){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}}
 if(x1<=x0||y1<=y0)return{x:0,y:0,w,h};const pad=Math.round(w*.025);
 x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w,x1+pad);y1=Math.min(h,y1+pad);return{x:x0,y:y0,w:x1-x0,h:y1-y0}}
async function renderPdf(){const job=++pdfJob;const box=$("#pages");
 const W=Math.min($("#pagewrap").clientWidth-16,900)*pdfZoom;const dpr=Math.min(window.devicePixelRatio||1,3);
 box.innerHTML="";box.style.width=W+"px";
 for(let i=1;i<=pdfDoc.numPages;i++){
  if(job!==pdfJob)return;
  const page=await pdfDoc.getPage(i);const v0=page.getViewport({scale:1});
  let s=W*dpr*2.5/v0.width;const maxPx=12e6;if(v0.width*v0.height*s*s>maxPx)s=Math.sqrt(maxPx/(v0.width*v0.height));
  const vp=page.getViewport({scale:s});
  const tmp=document.createElement("canvas");tmp.width=Math.round(vp.width);tmp.height=Math.round(vp.height);
  await page.render({canvasContext:tmp.getContext("2d"),viewport:vp}).promise;
  if(job!==pdfJob)return;
  const b=trimBox(tmp);const k=Math.min((W*dpr*2)/b.w,Math.sqrt(12e6/(b.w*b.h)));
  const c=document.createElement("canvas");c.width=Math.round(b.w*k);c.height=Math.round(b.h*k);
  const g=c.getContext("2d");g.imageSmoothingQuality="high";g.drawImage(tmp,b.x,b.y,b.w,b.h,0,0,c.width,c.height);
  c.style.width=W+"px";c.style.height=(b.h*W/b.w)+"px";c.setAttribute("aria-label",i+"쪽");box.appendChild(c);
 }
}
async function loadPdf(){if(pdfStarted)return;pdfStarted=true;
 try{pdfjsLib.GlobalWorkerOptions.workerSrc="pdf.worker.min.js";
  pdfDoc=await pdfjsLib.getDocument("heatsheet.pdf?v=28p").promise;await renderPdf();
 }catch(err){pdfStarted=false;$("#pages").innerHTML=`<p class="loading">PDF 표시 불가 · 위 "PDF 파일로 열기" 이용</p>`}
}

renderHeats();find();show(st.v);
</script>
